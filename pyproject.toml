[project]
name = "ansible-agent-pipeline"
version = "0.1.0"
description = "Multi-agent system for automated Ansible collection development"
requires-python = ">=3.10"
dependencies = [
    "anthropic[vertex]>=0.92.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-gitlab>=4.4.0",
    "PyGithub>=2.3.0",
    "google-cloud-aiplatform>=1.40.0",
    "google-auth>=2.27.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "asyncio>=3.4.3",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
